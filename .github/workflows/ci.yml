name: Bucket CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  protopeek:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SCOOP_CORE_SHA: b588a06e41d920d2123ec70aee682bae14935939
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bucket-repo

      - name: Checkout pinned Scoop installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Install
          ref: b0ee913725139b816f9178163af0aecdba07a7ed
          path: scoop-install

      - name: Checkout pinned Scoop core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: b588a06e41d920d2123ec70aee682bae14935939
          path: scoop-core

      - name: Validate manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $schema = Join-Path $env:GITHUB_WORKSPACE 'scoop-core\schema.json'
          $validator = Join-Path $env:GITHUB_WORKSPACE 'scoop-core\supporting\validator\bin\validator.exe'
          $manifests = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'bucket-repo\bucket\*.json')
          & $validator $schema $manifests.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Scoop manifest validation failed.' }

      - name: Install and smoke test both products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $scoopDir = Join-Path $env:RUNNER_TEMP 'scoop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scoop-install\install.ps1') -ScoopDir $scoopDir -RunAsAdmin
          $env:SCOOP = $scoopDir
          $coreDir = Join-Path $scoopDir 'apps\scoop\current'
          git -C $coreDir fetch --depth=1 origin $env:SCOOP_CORE_SHA
          git -C $coreDir checkout --detach $env:SCOOP_CORE_SHA
          if ((git -C $coreDir rev-parse HEAD).Trim() -ne $env:SCOOP_CORE_SHA) {
            throw 'Installed Scoop core does not match the pinned commit.'
          }

          $scoop = Join-Path $scoopDir 'shims\scoop.cmd'
          if (-not (Test-Path $scoop)) { throw 'Installed Scoop command shim is missing.' }
          $env:PATH = "$(Join-Path $scoopDir 'shims');$env:PATH"
          & $scoop config aria2-enabled false
          if ($LASTEXITCODE -ne 0) { throw 'Scoop configuration failed.' }
          $bucketPath = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'bucket-repo')).Path
          $bucketUrl = ([System.Uri]::new($bucketPath)).AbsoluteUri
          & $scoop bucket add shreyam $bucketUrl
          if ($LASTEXITCODE -ne 0) { throw 'Adding the local bucket failed.' }
          & $scoop install shreyam/protopeek
          if ($LASTEXITCODE -ne 0) { throw 'ProtoPeek installation failed.' }
          $aria2 = Join-Path $scoopDir 'apps\aria2\current\aria2c.exe'
          if (-not (Test-Path $aria2)) { throw 'ProtoPeek runtime dependency aria2 was not installed.' }
          $aria2Version = (& $aria2 --version 2>&1 | Out-String)
          if ($aria2Version -notmatch 'aria2 version') { throw 'aria2 runtime dependency is not executable.' }
          & $scoop install shreyam/dbterm
          if ($LASTEXITCODE -ne 0) { throw 'dbterm installation failed.' }
          $protopeekVersion = (protopeek -version 2>&1 | Out-String)
          $ppVersion = (pp -version 2>&1 | Out-String)
          $dbtermVersion = (dbterm --version 2>&1 | Out-String)
          if ($protopeekVersion -notmatch 'v0\.4\.0') { throw 'protopeek version mismatch.' }
          if ($ppVersion -notmatch 'v0\.4\.0') { throw 'pp version mismatch.' }
          if ($dbtermVersion -notmatch '0\.10\.0') { throw 'dbterm version mismatch.' }
          & $scoop update protopeek
          if ($LASTEXITCODE -ne 0) { throw 'ProtoPeek update failed.' }
          & $scoop update dbterm
          if ($LASTEXITCODE -ne 0) { throw 'dbterm update failed.' }
          & $scoop uninstall protopeek
          if ($LASTEXITCODE -ne 0) { throw 'ProtoPeek uninstall failed.' }
          & $scoop uninstall dbterm
          if ($LASTEXITCODE -ne 0) { throw 'dbterm uninstall failed.' }
          if (Test-Path (Join-Path $scoopDir 'shims\protopeek.*')) { throw 'protopeek shim was not removed.' }
          if (Test-Path (Join-Path $scoopDir 'shims\pp.*')) { throw 'pp shim was not removed.' }
          if (Test-Path (Join-Path $scoopDir 'shims\dbterm.*')) { throw 'dbterm shim was not removed.' }

      - name: Verify autoupdate contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCOOP = Join-Path $env:RUNNER_TEMP 'scoop'
          $env:SCOOP_HOME = Join-Path $env:GITHUB_WORKSPACE 'scoop-core'
          $schema = Join-Path $env:SCOOP_HOME 'schema.json'
          $validator = Join-Path $env:SCOOP_HOME 'supporting\validator\bin\validator.exe'
          foreach ($app in @(@{ Name = 'protopeek'; Version = '0.4.0' }, @{ Name = 'dbterm'; Version = '0.10.0' })) {
            $updatedDir = Join-Path $env:RUNNER_TEMP ("autoupdate-" + $app.Name)
            New-Item -ItemType Directory -Path $updatedDir | Out-Null
            $sourceManifest = Join-Path $env:GITHUB_WORKSPACE ("bucket-repo\bucket\" + $app.Name + ".json")
            Copy-Item $sourceManifest $updatedDir
            & (Join-Path $env:SCOOP_HOME 'bin\checkver.ps1') -App $app.Name -Dir $updatedDir -ForceUpdate -Version $app.Version -ThrowError
            & $validator $schema (Join-Path $updatedDir ($app.Name + '.json'))
            if ($LASTEXITCODE -ne 0) { throw ("Autoupdated manifest validation failed for " + $app.Name + ".") }
            $expected = Get-Content $sourceManifest -Raw | ConvertFrom-Json
            $actual = Get-Content (Join-Path $updatedDir ($app.Name + '.json')) -Raw | ConvertFrom-Json
            foreach ($arch in '64bit', 'arm64') {
              if ($actual.architecture.$arch.url -ne $expected.architecture.$arch.url) { throw ("$($app.Name) $arch URL drifted.") }
              if ($actual.architecture.$arch.hash -ne $expected.architecture.$arch.hash) { throw ("$($app.Name) $arch hash drifted.") }
            }
            if ($actual.depends -ne $expected.depends) { throw ("$($app.Name) runtime dependencies drifted.") }
          }
